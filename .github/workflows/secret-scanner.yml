# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@7641c7fdb01420696b5420ab85d88f599f32f609
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          # The pinned action already supplies --fail. Passing it twice makes
          # the scanner abort before examining any source.
          extra_args: --only-verified
